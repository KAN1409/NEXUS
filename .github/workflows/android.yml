name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.kareem.nexus/files/screenshots screenshots
      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0-validation
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/schemas/
            screenshots/
