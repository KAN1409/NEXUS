name: Publish NEXUS Update 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-update2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NEXUS_Update2.apk
      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view update-2 >/dev/null 2>&1 || \
            gh release create update-2 --target "$GITHUB_SHA" --title "NEXUS Update 2" --notes "Capture and observation milestone."
          gh release upload update-2 NEXUS_Update2.apk --clobber
